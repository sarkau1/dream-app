<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Lucent Dreaming app icon. Full-bleed so Android can crop it to any shape ("maskable");
       everything that matters stays inside the central safe circle (radius 40%). -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#292361"/>
      <stop offset="0.55" stop-color="#14122f"/>
      <stop offset="1" stop-color="#05040f"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f2fd"/>
      <stop offset="1" stop-color="#bda8ff"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="238" cy="266" r="138" fill="#fff"/>
      <circle cx="302" cy="222" r="118" fill="#000"/>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g filter="url(#glow)" opacity="0.7">
    <rect width="512" height="512" fill="#7c5cff" mask="url(#crescent)"/>
  </g>
  <rect width="512" height="512" fill="url(#moon)" mask="url(#crescent)"/>
  <circle cx="330" cy="190" r="10" fill="#8ff2da"/>
  <circle cx="366" cy="264" r="5.5" fill="#f4f2fd"/>
  <circle cx="300" cy="300" r="4" fill="#bdf7e9"/>
  <circle cx="150" cy="138" r="4" fill="#d9ccff" opacity="0.8"/>
  <circle cx="392" cy="326" r="3.5" fill="#d9ccff" opacity="0.7"/>
</svg>
