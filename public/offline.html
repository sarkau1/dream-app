<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05040f" />
    <title>Offline · Dusk &amp; Dawn</title>
    <!-- Shown by sw.js when a page can't be loaded. Self-contained: nothing else may be reachable. -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #05040f;
        color: #f4f2fd;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
      }
      h1 {
        margin: 12px 0 0;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 22rem;
        color: #aca6ce;
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        margin-top: 12px;
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #7c5cff;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon-192.png" alt="" />
      <h1>You’re offline</h1>
      <p>Your dreams are safe. Connect to the internet and try again to open your journal.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
